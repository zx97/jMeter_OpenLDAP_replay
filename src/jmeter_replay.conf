# =============================================================================
# jmeter_replay.conf — central parameter file for jMeter_OpenLDAP_replay
# (AGPL-3.0-or-later, part of the project; see the LICENSE file).
#
# Every script reads this file when it is present next to it (same
# directory) and uses the values below as defaults. If this file is absent,
# the scripts fall back to the same values compiled into the code, so you
# never have to edit the scripts themselves to adapt the project to your
# environment.
#
# Precedence: a variable already set in the environment is kept (the
# ":-" default syntax below only fills in when the variable is empty or
# unset), so `LDAP_HOST=myhost ./run_load_ramp.sh ...` still overrides
# this file for a single run.
#
# The .jmx test plan and replay_ldap.groovy read their own -J properties
# (REPLAY_FILE, PASSWORD_FILE, LDAP_HOST, LDAP_PORT, ...) from the jMeter
# command line; the defaults compiled in the .jmx are listed in README.md.
# =============================================================================

# --- host_monitor.sh --------------------------------------------------------
# SSH target of the LDAP server (the remote host being monitored).
LDAP_HOST="${LDAP_HOST:-ldap.example.org}"

# LDAP server instances monitored on the remote host (space-separated);
# a simple deployment has only one (e.g. "ldap1").
LDAP_SERVERS="${LDAP_SERVERS:-ldap1 ldap2 ldap3}"

# Block device holding the LDAP data (slapd LMDB), for the I/O columns.
LDAP_DISK="${LDAP_DISK:-sda}"

# Block device holding the jMeter results on the injector host.
INJECTOR_DISK="${INJECTOR_DISK:-nvme0n1}"

# --- shared run settings ----------------------------------------------------
# JMeter test plan used by the orchestrators.
JMX="${JMX:-replay_ldap.jmx}"

# host_monitor.sh sampling interval (seconds) used by the orchestrators.
MONITOR_INTERVAL="${MONITOR_INTERVAL:-2}"

# Command that runs JMeter. Default: jMeter installed via flatpak; set to a
# plain command (e.g. "jmeter") for a native installation on the host.
JMETER_CMD="${JMETER_CMD:-/usr/bin/flatpak run --branch=stable --arch=x86_64 --command=jmeter-wrapper.sh org.apache.jmeter}"

# --- run_load_ramp.sh -------------------------------------------------------
# Load-ramp limits: start at concurrency 1, multiply by STEP up to MAX,
# unless the service breaks (INFRA_ERR > 0).
MAX="${MAX:-16}"
STEP="${STEP:-2}"
LOOPS="${LOOPS:-1}"
KEEP_GOING="${KEEP_GOING:-0}"

# Output directory for the ramp steps (conc_<N>/ under it).
RAMP_OUTDIR="${RAMP_OUTDIR:-runs}"

# --- run_curve_test.sh ------------------------------------------------------
# Output directory for the curve test (single run).
CURVE_OUTDIR="${CURVE_OUTDIR:-runs/curve}"

# --- set_passwords.sh -------------------------------------------------------
# LDAP URI of the target directory (the example instance in this project
# listens on the loopback with LDAPS).
LDAP_URI="${LDAP_URI:-ldaps://localhost:636}"

# Admin DN used to modify the user passwords.
LDAP_ADMIN_DN="${LDAP_ADMIN_DN:-cn=Directory Manager,dc=example,dc=org}"

# Search bases whose direct entries get the new password (space-separated).
LDAP_SEARCH_BASES="${LDAP_SEARCH_BASES:-ou=People,dc=example,dc=org}"

# Apply the ppolicy pwdReset pass (pwdReset exists only when the ppolicy
# overlay is active): auto = detect the overlay, true = force the pass,
# false = skip it. When auto cannot detect it, the pass is skipped with a
# warning on stderr. The cn=config admin credentials used for a direct
# probe (CONFIG_DN / CONFIG_PW) are environment-only, never stored here.
PWDRESET="${PWDRESET:-auto}"

# --- report_html.py ---------------------------------------------------------
# Display labels of the dashboard. The CSV column prefixes used by
# host_monitor.sh must match the constants below (see README.md).
LDAP_HOST_LABEL="${LDAP_HOST_LABEL:-LDAP server}"
INJECTOR_HOST_LABEL="${INJECTOR_HOST_LABEL:-injector host}"
INJECTOR_PREFIX="${INJECTOR_PREFIX:-injector}"
SLAPD_PREFIX="${SLAPD_PREFIX:-slapd}"